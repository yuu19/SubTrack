name: Auth and billing regression

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  auth-billing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify build telemetry and source map settings
        run: node --test tests/build-config.test.mjs
      - run: pnpm test:auth
      - name: Build Cloudflare bundle with synthetic configuration
        run: pnpm run build
        env:
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: isolated-build-secret-0123456789abcdef
          SECRET_STRIPE_KEY: sk_test_isolated_build
          STRIPE_WEBHOOK_SECRET: whsec_isolated_build
          GOOGLE_CLIENT_ID: isolated-google-client
          GOOGLE_CLIENT_SECRET: isolated-google-secret
          RESEND_API_KEY: re_isolated_build
          SUBTRACK_LOCAL_CHECK: 'true'
          WRANGLER_SEND_METRICS: 'false'
