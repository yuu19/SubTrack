name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yaml

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://subtracknotify.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_STRIPE_KEY: ${{ secrets.PUBLIC_STRIPE_KEY }}
      SECRET_STRIPE_KEY: ${{ secrets.SECRET_STRIPE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
      ADMIN_BASIC_AUTH_USER: ${{ secrets.ADMIN_BASIC_AUTH_USER }}
      ADMIN_BASIC_AUTH_PASSWORD: ${{ secrets.ADMIN_BASIC_AUTH_PASSWORD }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
      PUSH_CRON_URL: ${{ secrets.PUSH_CRON_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Reject stale main revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::This revision is no longer the latest main. Run deployment for current main."
            exit 1
          fi

      - name: Validate deployment secrets
        run: bash scripts/deploy-preflight.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SvelteKit (Cloudflare target)
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: pnpm run build

      - name: Build & Deploy Worker
        uses: cloudflare/wrangler-action@v4.1.3
        env:
          DEPLOYMENT_SHA: ${{ github.sha }}
        with:
          command: deploy
          packageManager: pnpm
          vars: |
            DEPLOYMENT_SHA
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            SECRET_STRIPE_KEY
            STRIPE_WEBHOOK_SECRET
            RESEND_API_KEY
            BETTER_AUTH_SECRET
            ADMIN_USER_IDS
            ADMIN_BASIC_AUTH_USER
            ADMIN_BASIC_AUTH_PASSWORD
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            SENTRY_DSN
            VAPID_PUBLIC_KEY
            VAPID_PRIVATE_KEY
            PUSH_CRON_SECRET
            PUSH_CRON_URL

      - name: Verify production
        run: bash scripts/deploy-smoke.sh "$GITHUB_SHA"

      - name: Record deployment result
        if: always()
        env:
          DEPLOY_RESULT: ${{ job.status }}
        run: |
          {
            echo "### Production deployment"
            echo "- Commit: $GITHUB_SHA"
            echo "- Result: $DEPLOY_RESULT"
            echo "- URL: https://subtracknotify.com"
            echo "- Worker version: see Current Version ID in Build & Deploy Worker logs"
          } >> "$GITHUB_STEP_SUMMARY"
