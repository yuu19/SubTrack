name: Billing date regressions

on:
  pull_request:

permissions:
  contents: read

jobs:
  billing-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        time-zone: [UTC, America/Los_Angeles]
    env:
      TZ: ${{ matrix.time-zone }}
      SUBTRACK_LOCAL_CHECK: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec svelte-kit sync
      - name: Run isolated billing, display, and notification regressions
        run: >-
          pnpm exec vitest run --project server
          src/lib/billing-dates.spec.ts
          src/lib/time-zone.spec.ts
          src/lib/server/subscriptions.spec.ts
          src/lib/formSchema.spec.ts
          src/lib/calendar-events.spec.ts
          src/lib/locale.spec.ts
          src/lib/offline/subscriptions.spec.ts
          src/lib/server/notifications.spec.ts
          src/lib/i18n-copy.spec.ts
      - name: Build without deployment or Sentry uploads
        if: matrix.time-zone == 'UTC'
        env:
          # Route analysis imports auth; use its existing no-Stripe test mode, never real keys.
          E2E_AUTH_DISABLE_STRIPE: 'true'
        run: pnpm run build
