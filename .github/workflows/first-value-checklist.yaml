name: First value checklist regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/components/onboarding/**'
      - 'src/lib/onboarding-progress*'
      - 'src/routes/(storeFront)/subscriptions/**'
      - 'src/routes/(storeFront)/me/settings/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/first-value-checklist.yaml'

permissions:
  contents: read

jobs:
  first-value:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUBTRACK_LOCAL_CHECK: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec svelte-kit sync
      - name: Verify checklist progress
        run: pnpm exec vitest run --project server src/lib/onboarding-progress.spec.ts
      - name: Install test browser
        run: pnpm exec playwright install chromium
      - name: Verify onboarding in Japanese and English
        run: pnpm exec playwright test e2e/auth/first-value-checklist.test.ts --project=auth --workers=1
