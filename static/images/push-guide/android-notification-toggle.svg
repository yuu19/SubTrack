<svg xmlns="http://www.w3.org/2000/svg" width="420" height="900" viewBox="0 0 420 900" role="img" aria-labelledby="title desc">
  <title id="title">Android push notification setting screen</title>
  <desc id="desc">Illustrative screenshot of the subscriptions page showing the push notification toggle button on Android.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <rect width="420" height="900" fill="url(#bg)" />
  <rect x="20" y="16" width="380" height="868" rx="42" fill="#0f172a" />
  <rect x="35" y="34" width="350" height="832" rx="34" fill="#ffffff" />
  <rect x="155" y="40" width="110" height="18" rx="9" fill="#0f172a" />

  <text x="58" y="106" fill="#0f172a" font-family="Arial, sans-serif" font-size="25" font-weight="700">Subscriptions</text>
  <text x="58" y="132" fill="#64748b" font-family="Arial, sans-serif" font-size="14">Android view</text>

  <rect x="58" y="156" width="304" height="42" rx="11" fill="#0f172a" />
  <text x="131" y="182" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Enable Push</text>

  <rect x="58" y="214" width="304" height="86" rx="12" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="74" y="246" fill="#0f172a" font-family="Arial, sans-serif" font-size="14" font-weight="700">Receive reminders before payment day</text>
  <text x="74" y="271" fill="#0284c7" font-family="Arial, sans-serif" font-size="13" font-weight="700">View push guide</text>

  <rect x="58" y="320" width="304" height="154" rx="12" fill="#ffffff" stroke="#e2e8f0" />
  <text x="74" y="354" fill="#0f172a" font-family="Arial, sans-serif" font-size="18" font-weight="700">Netflix</text>
  <text x="74" y="378" fill="#64748b" font-family="Arial, sans-serif" font-size="13">Monthly / JPY 1,490</text>
  <rect x="74" y="398" width="272" height="8" rx="4" fill="#e2e8f0" />
  <rect x="74" y="398" width="178" height="8" rx="4" fill="#334155" />

  <rect x="58" y="490" width="304" height="154" rx="12" fill="#ffffff" stroke="#e2e8f0" />
  <text x="74" y="524" fill="#0f172a" font-family="Arial, sans-serif" font-size="18" font-weight="700">Spotify</text>
  <text x="74" y="548" fill="#64748b" font-family="Arial, sans-serif" font-size="13">Monthly / JPY 980</text>
  <rect x="74" y="568" width="272" height="8" rx="4" fill="#e2e8f0" />
  <rect x="74" y="568" width="148" height="8" rx="4" fill="#334155" />

  <rect x="58" y="662" width="304" height="144" rx="12" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="74" y="696" fill="#0f172a" font-family="Arial, sans-serif" font-size="16" font-weight="700">Android notification permission</text>
  <text x="74" y="718" fill="#64748b" font-family="Arial, sans-serif" font-size="12">Allow this app to send notifications?</text>
  <rect x="232" y="738" width="54" height="30" rx="8" fill="#e2e8f0" />
  <text x="248" y="758" fill="#334155" font-family="Arial, sans-serif" font-size="11" font-weight="700">No</text>
  <rect x="292" y="738" width="54" height="30" rx="8" fill="#0f172a" />
  <text x="305" y="758" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="700">Allow</text>
</svg>
