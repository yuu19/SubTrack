<svg xmlns="http://www.w3.org/2000/svg" width="430" height="910" viewBox="0 0 430 910" role="img" aria-labelledby="title desc">
  <title id="title">iPhone push notification setting screen</title>
  <desc id="desc">Illustrative screenshot of the subscriptions page showing the push notification toggle button on iPhone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <rect width="430" height="910" fill="url(#bg)" />
  <rect x="26" y="14" width="378" height="882" rx="54" fill="#111827" />
  <rect x="42" y="30" width="346" height="850" rx="44" fill="#ffffff" />
  <rect x="130" y="38" width="170" height="28" rx="14" fill="#111827" />

  <text x="66" y="112" fill="#0f172a" font-family="Arial, sans-serif" font-size="25" font-weight="700">Subscriptions</text>
  <text x="66" y="136" fill="#64748b" font-family="Arial, sans-serif" font-size="14">iPhone view</text>

  <rect x="66" y="160" width="298" height="42" rx="11" fill="#0f172a" />
  <text x="137" y="186" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Enable Push</text>

  <rect x="66" y="216" width="298" height="88" rx="12" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="82" y="248" fill="#0f172a" font-family="Arial, sans-serif" font-size="14" font-weight="700">Receive reminders before payment day</text>
  <text x="82" y="273" fill="#0284c7" font-family="Arial, sans-serif" font-size="13" font-weight="700">View push guide</text>

  <rect x="66" y="324" width="298" height="148" rx="12" fill="#ffffff" stroke="#e2e8f0" />
  <text x="82" y="356" fill="#0f172a" font-family="Arial, sans-serif" font-size="18" font-weight="700">Netflix</text>
  <text x="82" y="380" fill="#64748b" font-family="Arial, sans-serif" font-size="13">Monthly / JPY 1,490</text>
  <rect x="82" y="400" width="266" height="8" rx="4" fill="#e2e8f0" />
  <rect x="82" y="400" width="172" height="8" rx="4" fill="#334155" />

  <rect x="66" y="488" width="298" height="148" rx="12" fill="#ffffff" stroke="#e2e8f0" />
  <text x="82" y="520" fill="#0f172a" font-family="Arial, sans-serif" font-size="18" font-weight="700">Spotify</text>
  <text x="82" y="544" fill="#64748b" font-family="Arial, sans-serif" font-size="13">Monthly / JPY 980</text>
  <rect x="82" y="564" width="266" height="8" rx="4" fill="#e2e8f0" />
  <rect x="82" y="564" width="140" height="8" rx="4" fill="#334155" />

  <rect x="66" y="654" width="298" height="170" rx="12" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="82" y="688" fill="#0f172a" font-family="Arial, sans-serif" font-size="15" font-weight="700">Allow notifications from this website?</text>
  <text x="82" y="710" fill="#64748b" font-family="Arial, sans-serif" font-size="12">This helps you get payment reminders on time.</text>
  <rect x="194" y="740" width="74" height="32" rx="9" fill="#e2e8f0" />
  <text x="211" y="761" fill="#334155" font-family="Arial, sans-serif" font-size="11" font-weight="700">Don't</text>
  <rect x="274" y="740" width="74" height="32" rx="9" fill="#0f172a" />
  <text x="296" y="761" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="700">Allow</text>
</svg>
