  <text x="130" y="180" fill="#64748b" font-family="Arial, sans-serif" font-size="18">Manage your billing and reminders</text>

  <rect x="846" y="128" width="194" height="48" rx="12" fill="#0f172a" />
  <text x="867" y="159" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="600">Enable Push</text>

  <rect x="130" y="206" width="1020" height="56" rx="12" fill="#f8fafc" stroke="#cbd5e1" />
  <circle cx="158" cy="234" r="8" fill="#0ea5e9" />
  <text x="176" y="239" fill="#0f172a" font-family="Arial, sans-serif" font-size="17" font-weight="600">Receive push reminders before payment day.</text>
  <text x="777" y="239" fill="#0284c7" font-family="Arial, sans-serif" font-size="17" font-weight="700">View push guide</text>

  <rect x="130" y="292" width="492" height="164" rx="14" fill="#ffffff" stroke="#e2e8f0" />
  <text x="158" y="334" fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700">Netflix</text>
  <text x="158" y="364" fill="#64748b" font-family="Arial, sans-serif" font-size="16">Monthly / JPY 1,490</text>
  <rect x="158" y="392" width="436" height="10" rx="5" fill="#e2e8f0" />
  <rect x="158" y="392" width="280" height="10" rx="5" fill="#334155" />

  <rect x="658" y="292" width="492" height="164" rx="14" fill="#ffffff" stroke="#e2e8f0" />
  <text x="686" y="334" fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700">Spotify</text>
  <text x="686" y="364" fill="#64748b" font-family="Arial, sans-serif" font-size="16">Monthly / JPY 980</text>
  <rect x="686" y="392" width="436" height="10" rx="5" fill="#e2e8f0" />
  <rect x="686" y="392" width="228" height="10" rx="5" fill="#334155" />

  <rect x="130" y="486" width="1020" height="150" rx="14" fill="#ffffff" stroke="#e2e8f0" />
  <text x="158" y="528" fill="#0f172a" font-family="Arial, sans-serif" font-size="20" font-weight="700">Browser notification prompt</text>
  <text x="158" y="558" fill="#64748b" font-family="Arial, sans-serif" font-size="16">Allow notifications from this site?</text>
  <rect x="896" y="520" width="108" height="42" rx="10" fill="#e2e8f0" />
  <text x="929" y="546" fill="#334155" font-family="Arial, sans-serif" font-size="15" font-weight="700">Block</text>
  <rect x="1016" y="520" width="108" height="42" rx="10" fill="#0f172a" />
  <text x="1048" y="546" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700">Allow</text>
</svg>
