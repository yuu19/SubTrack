<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">PC push notification setting screen</title>
  <desc id="desc">Illustrative screenshot of the subscriptions page showing the push notification toggle button on desktop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)" />
  <rect x="80" y="52" width="1120" height="616" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <rect x="80" y="52" width="1120" height="46" rx="20" fill="#f1f5f9" />
  <circle cx="112" cy="75" r="8" fill="#ef4444" />
  <circle cx="138" cy="75" r="8" fill="#f59e0b" />
  <circle cx="164" cy="75" r="8" fill="#22c55e" />
  <rect x="220" y="64" width="830" height="22" rx="11" fill="#e2e8f0" />

